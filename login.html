<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logowanie — Gildia Innowacji</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
<style>
:root {
  --o1:#F47C28; --o2:#F69F37; --gold:#F7C146;
  --v1:#471F7D; --v2:#83109E; --v3:#BF01BF;
  --bg:#1e1a1c; --bg2:#252022; --bg3:#2e282a;
  --surface:#332d2f; --surface2:#3d3538;
  --text:#f5f0ea; --text2:rgba(245,240,234,0.62); --text3:rgba(245,240,234,0.35);
  --border:rgba(245,240,234,0.08);
  --radius:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}

.login-container{max-width:400px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;}
.login-header{text-align:center;margin-bottom:2rem;}
.login-title{font-family:'Fraunces',serif;font-size:1.8rem;font-weight:700;margin-bottom:0.5rem;background:linear-gradient(135deg,var(--o1),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.login-sub{font-size:0.85rem;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase;}

.form-group{margin-bottom:1.5rem;}
.form-label{display:block;font-size:0.8rem;font-weight:600;color:var(--text2);margin-bottom:0.5rem;}
.form-input{width:100%;padding:0.8rem 1rem;background:var(--bg3);border:1.5px solid var(--border);color:var(--text);font-family:'Syne',sans-serif;font-size:0.9rem;border-radius:8px;outline:none;transition:border-color 0.2s;}
.form-input:focus{border-color:var(--o1);}
.form-input::placeholder{color:var(--text3);}

.btn{width:100%;padding:0.9rem 1.5rem;border-radius:100px;font-size:0.85rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;cursor:pointer;border:none;transition:all 0.2s;font-family:'Syne',sans-serif;}
.btn-primary{background:linear-gradient(135deg,var(--o1),var(--v2));color:white;box-shadow:0 4px 14px rgba(244,124,40,0.3);}
.btn-primary:hover{opacity:0.88;transform:translateY(-1px);}
.btn-secondary{background:var(--surface2);border:1.5px solid var(--border);color:var(--text2);margin-top:0.8rem;}
.btn-secondary:hover{border-color:var(--o1);color:var(--o1);}

.auth-toggle{text-align:center;margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border);}
.auth-toggle a{color:var(--o2);text-decoration:none;font-size:0.8rem;font-weight:600;transition:color 0.2s;}
.auth-toggle a:hover{color:var(--o1);}

.error-message{background:rgba(247,103,104,0.1);border:1px solid rgba(247,103,104,0.3);color:#f76c6c;padding:0.8rem;border-radius:8px;font-size:0.8rem;margin-bottom:1rem;display:none;}
.success-message{background:rgba(46,213,115,0.1);border:1px solid rgba(46,213,115,0.3);color:#2ed573;padding:0.8rem;border-radius:8px;font-size:0.8rem;margin-bottom:1rem;display:none;}

.loading{opacity:0.6;pointer-events:none;}
</style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <div class="login-title">Gildia Innowacji</div>
    <div class="login-sub" id="formTitle">Zaloguj się</div>
  </div>

  <div class="error-message" id="errorMessage"></div>
  <div class="success-message" id="successMessage"></div>

  <form id="authForm" onsubmit="handleSubmit(event)">
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" class="form-input" id="email" placeholder="twoj@email.com" required>
    </div>

    <div class="form-group">
      <label class="form-label">Hasło</label>
      <input type="password" class="form-input" id="password" placeholder="••••••••" required>
    </div>

    <div class="form-group" id="nameGroup" style="display:none">
      <label class="form-label">Imię i nazwisko</label>
      <input type="text" class="form-input" id="name" placeholder="Jan Kowalski">
    </div>

    <button type="submit" class="btn btn-primary" id="submitBtn">Zaloguj się</button>
    <button type="button" class="btn btn-secondary" onclick="toggleAuthMode()" id="toggleBtn">Nie masz konta? Zarejestruj się</button>
  </form>

  <div class="auth-toggle">
    <a href="index.html">← Wróć do strony głównej</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.5/dist/pocketbase.umd.min.js"></script>
<script>
const pb = new PocketBase('http://127.0.0.1:8090');
let isLoginMode = true;

function toggleAuthMode() {
  isLoginMode = !isLoginMode;
  
  const formTitle = document.getElementById('formTitle');
  const nameGroup = document.getElementById('nameGroup');
  const submitBtn = document.getElementById('submitBtn');
  const toggleBtn = document.getElementById('toggleBtn');
  const nameInput = document.getElementById('name');
  
  if (isLoginMode) {
    formTitle.textContent = 'Zaloguj się';
    nameGroup.style.display = 'none';
    nameInput.required = false;
    submitBtn.textContent = 'Zaloguj się';
    toggleBtn.textContent = 'Nie masz konta? Zarejestruj się';
  } else {
    formTitle.textContent = 'Zarejestruj się';
    nameGroup.style.display = 'block';
    nameInput.required = true;
    submitBtn.textContent = 'Zarejestruj się';
    toggleBtn.textContent = 'Masz już konto? Zaloguj się';
  }
  
  clearMessages();
}

async function handleSubmit(event) {
  event.preventDefault();
  
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const name = document.getElementById('name').value;
  
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.classList.add('loading');
  
  clearMessages();
  
  try {
    if (isLoginMode) {
      await login(email, password);
    } else {
      await register(email, password, name);
    }
  } catch (error) {
    showError(error.message);
  } finally {
    submitBtn.classList.remove('loading');
  }
}

async function login(email, password) {
  try {
    const authData = await pb.collection('users').authWithPassword(email, password);
    showSuccess('Zalogowano pomyślnie! Przekierowywanie...');
    
    setTimeout(() => {
      window.location.href = 'generator-v2.html';
    }, 1000);
  } catch (error) {
    throw new Error('Nieprawidłowy email lub hasło');
  }
}

async function register(email, password, name) {
  try {
    await pb.collection('users').create({
      email: email,
      password: password,
      passwordConfirm: password,
      name: name,
      role: 'user'
    });
    
    showSuccess('Zarejestrowano pomyślnie! Możesz się zalogować.');
    
    setTimeout(() => {
      toggleAuthMode();
    }, 1500);
  } catch (error) {
    if (error.data?.email) {
      throw new Error('Email jest już zajęty');
    }
    throw new Error('Wystąpił błąd podczas rejestracji');
  }
}

function showError(message) {
  const errorDiv = document.getElementById('errorMessage');
  errorDiv.textContent = message;
  errorDiv.style.display = 'block';
}

function showSuccess(message) {
  const successDiv = document.getElementById('successMessage');
  successDiv.textContent = message;
  successDiv.style.display = 'block';
}

function clearMessages() {
  document.getElementById('errorMessage').style.display = 'none';
  document.getElementById('successMessage').style.display = 'none';
}

// Sprawdź czy użytkownik jest już zalogowany
if (pb.authStore.isValid) {
  window.location.href = 'generator-v2.html';
}
</script>
</body>
</html>
