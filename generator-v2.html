<style>
:root {
  --o1:#F47C28; --o2:#F69F37; --gold:#F7C146;
  --v1:#471F7D; --v2:#83109E; --v3:#BF01BF;
  --bg:#1e1a1c; --bg2:#252022; --bg3:#2e282a;
  --surface:#332d2f; --surface2:#3d3538;
  --text:#f5f0ea; --text2:rgba(245,240,234,0.62); --text3:rgba(245,240,234,0.35);
  --border:rgba(245,240,234,0.08);
  --radius:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;padding:2rem 1rem;}

.wrap{max-width:900px;margin:0 auto;}

/* HEADER */
.hdr{display:flex;align-items:center;gap:1rem;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border);}
.hdr-logo{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:700;background:linear-gradient(135deg,var(--o1),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hdr-sub{font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3);}
.hdr-actions{margin-left:auto;display:flex;gap:0.5rem;}

/* NAVIGATION */
.nav{display:flex;gap:0.5rem;margin-bottom:1.5rem;flex-wrap:wrap;}
.nav-btn{padding:0.5rem 1rem;border-radius:100px;font-size:0.75rem;font-weight:700;cursor:pointer;border:1.5px solid var(--border);color:var(--text2);background:transparent;transition:all 0.2s;letter-spacing:0.05em;text-transform:uppercase;}
.nav-btn:hover,.nav-btn.active{border-color:var(--o1);color:var(--o1);background:rgba(244,124,40,0.08);}

/* OUTLINE CONTAINER */
.outline-container{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;}

/* OUTLINE ITEM */
.outline-item{border-bottom:1px solid var(--border);}
.outline-item:last-child{border-bottom:none;}

.outline-header{display:flex;align-items:center;gap:0.8rem;padding:1rem 0;cursor:pointer;transition:background 0.2s;border-radius:8px;padding-left:0.5rem;padding-right:0.5rem;}
.outline-header:hover{background:var(--bg3);}
.outline-icon{width:24px;height:24px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:0.9rem;transition:transform 0.2s;flex-shrink:0;}
.outline-item.expanded .outline-icon{transform:rotate(90deg);background:var(--o1);}
.outline-title{flex:1;font-weight:600;font-size:0.95rem;}
.outline-status{font-size:0.7rem;padding:0.2rem 0.6rem;border-radius:100px;background:var(--surface2);color:var(--text3);flex-shrink:0;}

.outline-content{display:none;padding:0 0.5rem 1rem 3.5rem;}
.outline-item.expanded .outline-content{display:block;}

/* FIELDS */
.field{margin-bottom:1rem;}
.field label{display:block;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);font-weight:600;margin-bottom:0.4rem;}
.field input,.field select,.field textarea{
  width:100%;background:var(--bg3);border:1.5px solid var(--border);color:var(--text);
  font-family:'Syne',sans-serif;font-size:0.88rem;padding:0.7rem 0.9rem;border-radius:8px;outline:none;
  transition:border-color 0.2s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--o1);}
.field textarea{resize:vertical;min-height:80px;line-height:1.6;}

/* BUTTONS */
.btn{padding:0.6rem 1.2rem;border-radius:100px;font-size:0.8rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;border:none;cursor:pointer;transition:all 0.2s;}
.btn-primary{background:linear-gradient(135deg,var(--o1),var(--v2));color:white;}
.btn-primary:hover{opacity:0.9;transform:translateY(-1px);}
.btn-secondary{background:var(--surface);border:1.5px solid var(--border);color:var(--text2);}
.btn-secondary:hover{border-color:var(--o1);color:var(--o1);}
.btn-action{display:inline-flex;align-items:center;gap:0.5rem;padding:0.5rem 1rem;border-radius:8px;font-size:0.75rem;font-weight:700;text-decoration:none;transition:all 0.2s;border:1px solid var(--border);background:var(--surface2);color:var(--text2);}
.btn-action:hover{border-color:var(--o1);color:var(--o1);}

/* PROJECT LIST */
.project-list{display:flex;flex-direction:column;gap:0.8rem;}
.project-item{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:1rem;cursor:pointer;transition:border-color 0.2s;}
.project-item:hover{border-color:var(--o1);}
.project-item.active{border-color:var(--o1);background:rgba(244,124,40,0.05);}
.project-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;}
.project-id{font-size:0.7rem;color:var(--o1);font-weight:700;letter-spacing:0.1em;text-transform:uppercase;}
.project-name{font-weight:700;font-size:0.95rem;flex:1;margin-left:0.8rem;}
.project-meta{font-size:0.75rem;color:var(--text3);display:flex;gap:1rem;}
.project-actions{display:flex;gap:0.5rem;margin-top:0.5rem;}

/* STATUS BADGES */
.status-badge{font-size:0.65rem;padding:0.2rem 0.6rem;border-radius:100px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;}
.status-koncepcja{background:rgba(246,159,55,0.15);color:var(--o2);border:1px solid rgba(246,159,55,0.25);}
.status-backlog{background:rgba(245,240,234,0.08);color:var(--text3);border:1px solid var(--border);}
.status-realizacja{background:rgba(244,124,40,0.15);color:var(--o1);border:1px solid rgba(244,124,40,0.25);}
.status-prototypowanie{background:rgba(191,1,191,0.15);color:var(--v3);border:1px solid rgba(191,1,191,0.25);}
.status-testowanie{background:rgba(6,182,212,0.15);color:#06b6d4;border:1px solid rgba(6,182,212,0.25);}
.status-wdrozenie{background:rgba(168,85,247,0.15);color:#a855f7;border:1px solid rgba(168,85,247,0.25);}
.status-zakonczone{background:rgba(46,213,115,0.15);color:#2ed573;border:1px solid rgba(46,213,115,0.25);}

/* CATEGORY BADGES */
.cat-badge{font-size:0.65rem;padding:0.2rem 0.6rem;border-radius:100px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;}
.cat-spoleczne{background:rgba(59,130,246,0.15);color:#3b82f6;border:1px solid rgba(59,130,246,0.25);}
.cat-biznesowe{background:rgba(247,193,70,0.15);color:var(--gold);border:1px solid rgba(247,193,70,0.25);}

/* MEDIA PREVIEW */
.media-preview{width:100%;height:150px;background:var(--bg2);border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);margin-bottom:1rem;overflow:hidden;}
.media-preview img{width:100%;height:100%;object-fit:cover;}
.media-preview iframe{width:100%;height:100%;border:none;}
.media-placeholder{font-size:2rem;color:var(--text3);}

/* EMPTY STATE */
.empty{text-align:center;padding:3rem;color:var(--text3);}
.empty-icon{font-size:3rem;margin-bottom:1rem;}
.empty h3{font-size:1.1rem;color:var(--text2);margin-bottom:0.5rem;}
</style>

    </div>
    
    <div id="outline-root"></div>

</div>

        "termin": "2024-2025"
      },
      "media": {
        "instagram": "https://instagram.com/gildianewsletter"
      },
      "dokumentacja": "",
      "tagi": ["newsletter", "komunikacja", "content", "social media"]
    }
  ];

  // Najpierw spróbuj załadować z własnego pliku (dla testów)
  try {
    const response = await fetch('projekty-v2.json');
    if (response.ok) {
      projects = await response.json();
    } else {
      projects = SAMPLE_PROJECTS;
    }
  } catch (e) {
    projects = SAMPLE_PROJECTS;
  }
  
  renderProjectList();
  fillPicker();
}

// Renderuj listę projektów
function renderProjectList() {
  const container = document.getElementById('project-list');
  
  if (projects.length === 0) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📂</div>
        <h3>Brak projektów</h3>
        <p>Utwórz pierwszy projekt lub załaduj dane z projekty.json</p>
      </div>
    `;
    return;
  }
  
  container.innerHTML = projects.map(p => `
    <div class="project-item ${currentProject?.id === p.id ? 'active' : ''}" onclick="selectProject('${p.id}')">
      <div class="project-header">
        <span class="project-id">${p.id}</span>
        <span class="project-name">${p.nazwa_projektu || p.tytul}</span>
        <span class="status-badge status-${p.status}">${getStatusLabel(p.status)}</span>
      </div>
      <div class="project-meta">
        <span class="cat-badge cat-${p.kategoria}">${getCategoryLabel(p.kategoria)}</span>
        <span>${p.podkategoria || 'Brak podkategorii'}</span>
      </div>
      <div class="project-actions">
        <span class="project-actions-item">📄 ${p.dokumentacja ? 'Dokumentacja' : 'Brak dokumentacji'}</span>
        <span class="project-actions-item">🖼️ ${hasContent(p.media) ? 'Media' : 'Brak media'}</span>
      </div>
    </div>
  `).join('');
}

// Wybierz projekt
function selectProject(id) {
  currentProject = projects.find(p => p.id === id);
  if (currentProject) {
    renderProjectList();
    renderDetailOutline();
    syncPicker();
    switchView('detail');
  }
}

// Przełącz widok
function switchView(view) {
  currentView = view;
  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelector(`[data-view="${view}"]`).classList.add('active');
  
  document.getElementById('view-list').style.display = view === 'list' ? 'block' : 'none';
  document.getElementById('view-detail').style.display = view === 'detail' ? 'block' : 'none';
  
  if (view === 'detail' && currentProject) {
    renderDetailOutline();
  }
  
  if (view === 'list') {
    syncPicker();
  }
}

// Nowy projekt

  const lastId = projects.length > 0 ? projects[projects.length - 1].id : 'p000';

// Przełącz sekcję
function toggleSection(header) {
  const item = header.closest('.outline-item');
  item.classList.toggle('expanded');
}

// Aktualizuj pole
function updateField(field, value) {
  if (currentProject) {
    currentProject[field] = value;
    if (field === 'nazwa_projektu') {
      document.getElementById('detail-title').textContent = value || 'Nowy projekt';
    }
  }
}

// Aktualizuj zagnieżdżone pole
function updateNestedField(parent, field, value) {
  if (currentProject) {
    if (!currentProject[parent]) currentProject[parent] = {};
    currentProject[parent][field] = value;
  }
}

// Aktualizuj pole media
function updateMediaField(field, value) {
  if (currentProject) {
    if (!currentProject.media) currentProject.media = {};
    currentProject.media[field] = value;
  }
}

// Aktualizuj tagi
function updateTags(value) {
  if (currentProject) {
    currentProject.tagi = value.split(',').map(t => t.trim()).filter(Boolean);
  }
}

// Sprawdź czy obiekt ma zawartość
function hasContent(obj) {
  if (!obj) return false;
  if (Array.isArray(obj)) return obj.length > 0;
  if (typeof obj === 'object') {
    return Object.values(obj).some(v => v && v !== '');
  }
  return Boolean(obj);
}

// Renderuj podgląd media
function renderMediaPreview(media) {
  if (!media) return '<div class="media-placeholder">🖼️</div>';
  
  if (media.zdjecie) {
    return `<img src="${media.zdjecie}" alt="Podgląd" onerror="this.parentElement.innerHTML='<div class=media-placeholder>❌ Błąd</div>'">`;
  }
  
  if (media.youtube) {
    return `<iframe src="https://www.youtube.com/embed/${media.youtube}" allowfullscreen></iframe>`;
  }
  
  return '<div class="media-placeholder">🖼️</div>';
}

// Zapisz obecny projekt
function saveCurrentProject() {
  if (!currentProject) return;
  
  const existingIndex = projects.findIndex(p => p.id === currentProject.id);
  if (existingIndex >= 0) {
    projects[existingIndex] = currentProject;
  } else {
    projects.push(currentProject);
  }
  
  alert('Projekt zapisany! Pamiętaj aby pobrać zaktualizowany projekty-v2.json');
  renderProjectList();
  fillPicker();
}

// Zapisz wszystkie zmiany
function saveAllChanges() {
  const json = JSON.stringify(projects, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'projekty-v2.json';
  a.click();
  URL.revokeObjectURL(url);
  fillPicker();
}

// Pomocnicze funkcje
function getStatusLabel(status) {
  const labels = {
    koncepcja: 'Koncepcja', backlog: 'Backlog', realizacja: 'Realizacja',
    prototypowanie: 'Prototypowanie', testowanie: 'Testowanie',
    wdrozenie: 'Wdrożenie', zakonczone: 'Zakończone'
  };
  return labels[status] || status;
}

function getCategoryLabel(kategoria) {
  const labels = { spoleczne: 'Społeczne', biznesowe: 'Biznesowe' };
  return labels[kategoria] || kategoria;
}

// Wypełnij picker projektów
function fillPicker() {
  const picker = document.getElementById('projectPicker');
  picker.innerHTML = '<option value="">-- Wybierz projekt do edycji --</option>';
  projects.forEach(p => {
    const label = `${p.id} - ${p.nazwa_projektu || p.tytul}`;
    picker.innerHTML += `<option value="${p.id}">${label}</option>`;
  });
}

// Wybierz projekt z pickera
function selectProjectToEdit() {
  const picker = document.getElementById('projectPicker');
  const id = picker.value;
  if (id) {
    selectProject(id);
    switchView('detail');
  }
}

// Synchronizuj picker z bieżącym projektem
function syncPicker() {
  const picker = document.getElementById('projectPicker');
  if (currentProject) {
    picker.value = currentProject.id;
  } else {
    picker.value = '';
  }
}

// Inicjalizacja
loadProjects();
