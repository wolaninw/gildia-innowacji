<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Google Analytics 4 + zgoda cookies (Consent Mode v2) -->
<script src="assets/analytics.js"></script>
<title>Katalog V2 — Gildia Innowacji</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
<style>
:root {
  --o1:#F47C28; --o2:#F69F37; --gold:#F7C146;
  --v1:#471F7D; --v2:#83109E; --v3:#BF01BF;
  --bg:#1e1a1c; --bg2:#252022; --bg3:#2e282a;
  --surface:#332d2f; --surface2:#3d3538;
  --text:#f5f0ea; --text2:rgba(245,240,234,0.62); --text3:rgba(245,240,234,0.35);
  --border:rgba(245,240,234,0.08);
  --radius:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:1rem 2.5rem;background:rgba(30,26,28,0.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
.nav-brand{display:flex;align-items:center;gap:0.7rem;text-decoration:none;}
.nav-brand img{width:38px;height:38px;object-fit:contain;border-radius:50%;box-shadow:0 0 0 2px rgba(244,124,40,0.3);background:var(--bg3);padding:2px;}
.nav-brand-name{font-size:0.95rem;font-weight:800;background:linear-gradient(135deg,var(--o1),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.nav-right{display:flex;align-items:center;gap:1rem;}
.nav-back{font-size:0.78rem;font-weight:500;color:var(--text2);text-decoration:none;transition:color 0.2s;}
.nav-back:hover{color:var(--text);}
.nav-add{background:linear-gradient(135deg,var(--o1),var(--v2));color:white;font-size:0.75rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:0.55rem 1.2rem;border:none;border-radius:100px;cursor:pointer;box-shadow:0 4px14px rgba(244,124,40,0.3);transition:opacity 0.2s,transform 0.15s;}
.nav-add:hover{opacity:0.88;transform:translateY(-1px);}

/* HEADER */
.catalog-header{padding:7rem 2.5rem 2rem;max-width:1300px;margin:0 auto;}
.ch-eyebrow{font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--o1);font-weight:700;margin-bottom:0.8rem;display:flex;align-items:center;gap:0.5rem;}
.ch-eyebrow::before{content:'';width:16px;height:2px;background:var(--o1);border-radius:2px;}
.ch-title{font-family:'Fraunces',serif;font-size:clamp(2rem,4vw,3.5rem);font-weight:700;line-height:1.05;margin-bottom:0.8rem;}
.ch-title em{color:var(--o1);font-style:italic;}
.ch-sub{font-size:0.95rem;color:var(--text2);line-height:1.75;max-width:580px;margin-bottom:2rem;}

/* CONTROLS */
.controls{padding:0 2.5rem 2rem;max-width:1300px;margin:0 auto;display:flex;gap:1rem;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.view-switcher{display:flex;gap:0.5rem;background:var(--surface);padding:0.3rem;border-radius:100px;border:1px solid var(--border);}
.view-btn{padding:0.4rem 1rem;border-radius:100px;font-size:0.75rem;font-weight:700;cursor:pointer;border:none;background:transparent;color:var(--text2);transition:all 0.2s;}
.view-btn.active{background:var(--o1);color:white;}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:300px;}
.search-wrap input{width:100%;background:var(--surface);border:1.5px solid var(--border);color:var(--text);font-family:'Syne',sans-serif;font-size:0.88rem;padding:0.75rem 1rem 0.75rem 2.6rem;border-radius:100px;outline:none;transition:border-color 0.2s;}
.search-wrap input:focus{border-color:var(--o1);}
.search-wrap input::placeholder{color:var(--text3);}
.search-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-size:0.9rem;color:var(--text3);pointer-events:none;}

/* FILTERS */
.filters{display:flex;gap:0.8rem;flex-wrap:wrap;align-items:center;}
.filter-select{background:var(--surface);border:1.5px solid var(--border);color:var(--text);font-family:'Syne',sans-serif;font-size:0.75rem;padding:0.6rem 1rem;border-radius:100px;outline:none;cursor:pointer;transition:border-color 0.2s;min-width:140px;}
.filter-select:focus{border-color:var(--o1);}
.filter-select option{background:var(--bg3);color:var(--text);}
.filter-clear{background:transparent;border:none;color:var(--text3);font-size:0.75rem;cursor:pointer;padding:0.6rem 1rem;border-radius:100px;transition:color 0.2s;}
.filter-clear:hover{color:var(--o1);}

/* FEATURED SECTION */
.featured-section{padding:0 2.5rem 2rem;max-width:1300px;margin:0 auto;}
.featured-title{font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:0.5rem;}
.featured-title::before{content:'';width:16px;height:2px;background:var(--gold);border-radius:2px;}
.featured-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;}
.featured-card{background:var(--surface);border:2px solid var(--gold);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform 0.22s,box-shadow 0.22s;}
.featured-card:hover{transform:translateY(-4px);box-shadow:0 12px 36px rgba(247,193,70,0.2);}
.featured-media{position:relative;padding-bottom:56.25%;overflow:hidden;background:var(--bg3);}
.featured-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 0.4s;}
.featured-card:hover .featured-media img{transform:scale(1.04);}
.featured-badge{position:absolute;top:0.6rem;left:0.6rem;font-size:0.55rem;letter-spacing:0.1em;text-transform:uppercase;font-weight:700;padding:0.15rem 0.5rem;border-radius:100px;background:var(--gold);color:var(--bg);backdrop-filter:blur(8px);}
.featured-body{padding:1rem;}
.featured-title-text{font-family:'Fraunces',serif;font-weight:700;font-size:0.95rem;line-height:1.3;color:var(--text);margin-bottom:0.3rem;}
.featured-sub{font-size:0.65rem;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;font-weight:600;}

/* GRID VIEW */
.grid-view{padding:0 2.5rem 4rem;max-width:1300px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;}

/* LIST VIEW */
.list-view{padding:0 2.5rem 4rem;max-width:1300px;margin:0 auto;display:none;flex-direction:column;gap:0.8rem;}
.list-view.active{display:flex;}

/* PROJECT CARD (GRID) */
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform 0.22s,border-color 0.22s,box-shadow 0.22s;display:flex;flex-direction:column;}
.pcard:hover{transform:translateY(-4px);border-color:rgba(244,124,40,0.3);box-shadow:0 12px 36px rgba(0,0,0,0.35);}

.pcard-media{position:relative;padding-bottom:56.25%;overflow:hidden;background:var(--bg3);flex-shrink:0;}
.pcard-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 0.4s;}
.pcard:hover .pcard-media img{transform:scale(1.04);}
.pcard-media-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.5rem;}
.media-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(30,26,28,0.7),transparent 50%);pointer-events:none;}

.pcard-cat{position:absolute;top:0.8rem;left:0.8rem;font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;padding:0.22rem 0.7rem;border-radius:100px;backdrop-filter:blur(8px);}
.cat-spoleczne{background:rgba(59,130,246,0.2);color:#3b82f6;border:1px solid rgba(59,130,246,0.3);}
.cat-biznesowe{background:rgba(247,193,70,0.2);color:var(--gold);border:1px solid rgba(247,193,70,0.3);}

.pcard-status{position:absolute;top:0.8rem;right:0.8rem;display:flex;align-items:center;gap:0.35rem;font-size:0.6rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:0.22rem 0.7rem;border-radius:100px;backdrop-filter:blur(8px);}
.status-zakonczone{background:rgba(46,213,115,0.15);color:#2ed573;border:1px solid rgba(46,213,115,0.25);}
.status-prototypowanie{background:rgba(191,1,191,0.15);color:var(--v3);border:1px solid rgba(191,1,191,0.25);}
.status-koncepcja{background:rgba(246,159,55,0.15);color:var(--o2);border:1px solid rgba(246,159,55,0.25);}
.status-testowanie{background:rgba(6,182,212,0.15);color:#06b6d4;border:1px solid rgba(6,182,212,0.25);}
.status-realizacja{background:rgba(244,124,40,0.15);color:var(--o1);border:1px solid rgba(244,124,40,0.25);}
.status-wdrozenie{background:rgba(168,85,247,0.15);color:#a855f7;border:1px solid rgba(168,85,247,0.25);}
.status-backlog{background:rgba(245,240,234,0.08);color:var(--text3);border:1px solid var(--border);}

.pcard-body{padding:1.4rem;flex:1;display:flex;flex-direction:column;gap:0.7rem;}
.pcard-sub{font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);font-weight:600;margin-bottom:-0.3rem;}
.pcard-title{font-family:'Fraunces',serif;font-weight:700;font-size:1.05rem;line-height:1.3;color:var(--text);}
.pcard-pitch{font-size:0.8rem;color:var(--text2);line-height:1.65;flex:1;}
.pcard-tags{display:flex;gap:0.4rem;flex-wrap:wrap;margin-top:auto;padding-top:0.4rem;}
.ptag{font-size:0.6rem;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;padding:0.18rem 0.55rem;border-radius:100px;background:var(--surface2);color:var(--text3);}

.pcard-footer{padding:0.8rem 1.4rem;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:0.72rem;color:var(--text3);}
.pcard-more{color:var(--o2);font-weight:600;display:flex;align-items:center;gap:0.3rem;transition:color 0.2s;}
.pcard:hover .pcard-more{color:var(--o1);}

/* PROJECT CARD (LIST) */
.list-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem;cursor:pointer;transition:border-color 0.2s,box-shadow 0.2s;display:flex;gap:1rem;align-items:center;}
.list-card:hover{border-color:var(--o1);box-shadow:0 4px 20px rgba(244,124,40,0.15);}
.list-media{width:120px;height:80px;border-radius:8px;overflow:hidden;background:var(--bg3);flex-shrink:0;}
.list-media img{width:100%;height:100%;object-fit:cover;}
.list-media-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--text3);}
.list-body{flex:1;min-width:0;}
.list-header{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.3rem;}
.list-sub{font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);font-weight:600;}
.list-title{font-family:'Fraunces',serif;font-weight:700;font-size:1rem;color:var(--text);}
.list-pitch{font-size:0.8rem;color:var(--text2);line-height:1.5;margin-bottom:0.5rem;}
.list-meta{display:flex;gap:1rem;font-size:0.7rem;color:var(--text3);}
.list-actions{display:flex;gap:0.5rem;flex-shrink:0;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(14,10,16,0.85);z-index:500;backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:2rem;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto;position:relative;animation:modalIn 0.25s ease both;}
@keyframes modalIn{from{opacity:0;transform:scale(0.95) translateY(10px);}to{opacity:1;transform:none;}}
.modal-close{position:sticky;top:0;display:flex;justify-content:flex-end;padding:1rem 1rem 0;background:var(--bg2);z-index:1;}
.modal-close button{background:var(--surface);border:1px solid var(--border);color:var(--text2);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:background 0.2s,color 0.2s;}
.modal-close button:hover{background:var(--surface2);color:var(--text);}
.modal-media{position:relative;padding-bottom:52%;overflow:hidden;background:var(--bg3);margin-bottom:1.5rem;border-radius:12px;}
.modal-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.modal-media iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
.modal-media-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:6rem;}
.modal-body{padding:2rem;}

/* OUTLINE IN MODAL */
.outline-item{border-bottom:1px solid var(--border);}
.outline-item:last-child{border-bottom:none;}
.outline-header{display:flex;align-items:center;gap:0.8rem;padding:1rem 0;cursor:pointer;transition:background 0.2s;border-radius:8px;padding-left:0.5rem;padding-right:0.5rem;}
.outline-header:hover{background:var(--bg3);}
.outline-icon{width:24px;height:24px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:0.9rem;transition:transform 0.2s;flex-shrink:0;}
.outline-item.expanded .outline-icon{transform:rotate(90deg);background:var(--o1);}
.outline-title{flex:1;font-weight:600;font-size:0.95rem;}
.outline-status{font-size:0.7rem;padding:0.2rem 0.6rem;border-radius:100px;background:var(--surface2);color:var(--text3);flex-shrink:0;}
.outline-content{display:none;padding:0 0.5rem 1rem 3.5rem;line-height:1.6;color:var(--text2);}
.outline-item.expanded .outline-content{display:block;}

/* MODAL ACTIONS */
.modal-actions{display:flex;gap:0.8rem;flex-wrap:wrap;margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border);}
.btn-action{display:inline-flex;align-items:center;gap:0.5rem;padding:0.7rem 1.4rem;border-radius:100px;font-size:0.78rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;text-decoration:none;border:none;cursor:pointer;transition:all 0.2s;}
.btn-action-main{background:linear-gradient(135deg,var(--o1),var(--v2));color:white;box-shadow:0 4px 14px rgba(244,124,40,0.3);}
.btn-action-main:hover{opacity:0.88;transform:translateY(-1px);}
.btn-action-outline{background:transparent;border:1.5px solid var(--border);color:var(--text2);}
.btn-action-outline:hover{border-color:var(--o1);color:var(--o1);}

/* SOCIAL ICONS */
.social-icons{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.5rem;}
.social-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:transform 0.2s,background 0.2s;border:1px solid var(--border);background:var(--surface2);}
.social-icon:hover{transform:scale(1.1);border-color:var(--o1);}
.social-icon img{width:20px;height:20px;object-fit:contain;}

/* RESPONSIVE */
@media(max-width:1024px){
  .featured-grid{grid-template-columns:repeat(2,1fr);}
  .grid-view{grid-template-columns:1fr 1fr;}
}
@media(max-width:640px){
  nav{padding:1rem 1.2rem;}
  .nav-back{display:none;}
  .catalog-header,.controls,.featured-section,.grid-view,.list-view{padding-left:1.2rem;padding-right:1.2rem;}
  .featured-grid{grid-template-columns:1fr;}
  .grid-view{grid-template-columns:1fr;}
  .list-card{flex-direction:column;text-align:center;}
  .list-media{width:100%;height:150px;}
  .list-body{width:100%;}
  .list-header{justify-content:center;}
  .list-meta{justify-content:center;}
  .list-actions{width:100%;justify-content:center;}
  .controls{flex-direction:column;align-items:stretch;}
  .filters{justify-content:space-between;}
  .filter-select{flex:1;min-width:auto;}
  .search-wrap{max-width:100%;}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">
    <img src="assets/logo.png" alt="Logo" onerror="this.style.display='none'">
    <span class="nav-brand-name">Gildia Innowacji</span>
  </a>
  <div class="nav-right">
    <a href="index.html" class="nav-back">← Strona główna</a>
    <button class="nav-add" onclick="window.location.href='generator-v2.html'">+ Dodaj projekt</button>
  </div>
</nav>

<div class="catalog-header">
  <div class="ch-eyebrow">Katalog Innowacji</div>
  <h1 class="ch-title">Projekty czekające<br>na <em>realizatorów.</em></h1>
  <p class="ch-sub">Dołącz do istniejącego projektu lub zaproponuj własny. Każdy projekt ma dokumentację, mentora i miejsce w ekosystemie Gildii.</p>
</div>

<div class="controls">
  <div class="view-switcher">
    <button class="view-btn active" onclick="switchView('grid',this)" data-view="grid">▦ Kafelki</button>
    <button class="view-btn" onclick="switchView('list',this)" data-view="list">☰ Lista</button>
  </div>
  <div class="filters">
    <select class="filter-select" id="categoryFilter" onchange="renderCatalog()">
      <option value="">Wszystkie kategorie</option>
      <option value="spoleczne">Społeczne</option>
      <option value="biznesowe">Biznesowe</option>
    </select>
    <select class="filter-select" id="statusFilter" onchange="renderCatalog()">
      <option value="">Wszystkie etapy</option>
      <option value="koncepcja">Koncepcja</option>
      <option value="backlog">Backlog</option>
      <option value="realizacja">Realizacja</option>
      <option value="prototypowanie">Prototypowanie</option>
      <option value="testowanie">Testowanie</option>
      <option value="wdrozenie">Wdrożenie</option>
      <option value="zakonczone">Zakończone</option>
    </select>
    <button class="filter-clear" onclick="clearFilters()">Wyczyść filtry</button>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Szukaj projektu..." oninput="renderCatalog()">
  </div>
</div>

<!-- FEATURED SECTION -->
<div class="featured-section" id="featuredSection">
  <div class="featured-title">🌟 Najnowsze projekty</div>
  <div class="featured-grid" id="featuredGrid"></div>
</div>

<!-- GRID VIEW -->
<div class="grid-view" id="gridView"></div>

<!-- LIST VIEW -->
<div class="list-view" id="listView"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modalBox">
    <div class="modal-close"><button onclick="closeModal(true)" title="Zamknij">✕</button></div>
    <div class="modal-media" id="modalMedia"></div>
    <div class="modal-body">
      <div id="modalOutline"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>
</div>

let projects = [];
let currentView = 'grid';

const ICONS = { spoleczne:'🤝', biznesowe:'💼', default:'🚀' };

      },

    },

// Switch view
function switchView(view, btn) {
  currentView = view;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  
  document.getElementById('gridView').style.display = view === 'grid' ? 'grid' : 'none';
  document.getElementById('listView').style.display = view === 'list' ? 'flex' : 'none';
  
  renderCatalog();
}

// Clear filters
function clearFilters() {
  document.getElementById('categoryFilter').value = '';
  document.getElementById('statusFilter').value = '';
  document.getElementById('searchInput').value = '';
  renderCatalog();
}

// Render catalog
function renderCatalog() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const categoryFilter = document.getElementById('categoryFilter').value;
  const statusFilter = document.getElementById('statusFilter').value;
  
  const filtered = projects.filter(p => {
    // Search filter
    const matchQ = !q || (p.nazwa_projektu || p.tytul || '').toLowerCase().includes(q) || 
                    (p.omowienie || p.pitch || '').toLowerCase().includes(q) ||
                    (p.tagi || []).some(t => t.toLowerCase().includes(q)) ||
                    (p.podkategoria || '').toLowerCase().includes(q);
    
    // Category filter
    const matchCategory = !categoryFilter || p.kategoria === categoryFilter;
    
    // Status filter
    const matchStatus = !statusFilter || p.status === statusFilter;
    
    return matchQ && matchCategory && matchStatus;
  });

  // Featured section (4 najnowsze)
  const latest = projects.slice(-4).reverse();
  renderFeatured(latest);
  
  // Main view
  if (currentView === 'grid') {
    renderGridView(filtered);
  } else {
    renderListView(filtered);
  }
}

// Render featured section
function renderFeatured(latest) {
  const container = document.getElementById('featuredGrid');
  if (latest.length === 0) {
    document.getElementById('featuredSection').style.display = 'none';
    return;
  }
  
  document.getElementById('featuredSection').style.display = 'block';
  container.innerHTML = latest.map(p => featuredCardHTML(p)).join('');
}

function featuredCardHTML(p) {
  const icon = ICONS[p.kategoria] || ICONS.default;
  const mediaHTML = buildMediaHTML(p.media);
  
  return `
    <div class="featured-card" onclick="openModal('${p.id}')">
      <div class="featured-media">
        ${mediaHTML}
        <div class="featured-badge">🆕 NOWY</div>
      </div>
      <div class="featured-body">
        <div class="featured-title-text">${p.nazwa_projektu || p.tytul}</div>
        <div class="featured-sub">${p.podkategoria || ''}</div>
      </div>
    </div>
  `;
}

// Render grid view
function renderGridView(filtered) {
  const container = document.getElementById('gridView');
  container.innerHTML = filtered.map(p => cardHTML(p)).join('');
}

// Render list view
function renderListView(filtered) {
  const container = document.getElementById('listView');
  container.innerHTML = filtered.map(p => listCardHTML(p)).join('');
}

// Card HTML (grid)
function cardHTML(p) {
  const icon = ICONS[p.kategoria] || ICONS.default;
  const katLabel = KAT_LABELS[p.kategoria] || p.kategoria;
  const mediaHTML = buildMediaHTML(p.media);
  const statusLabel = STATUS_LABELS[p.status] || p.status;
  const statusClass = `status-${p.status}`;
  const tagsHTML = (p.tagi || []).map(t => `<span class="ptag">${t}</span>`).join('');

  return `
<div class="pcard" onclick="openModal('${p.id}')">
  <div class="pcard-media">
    ${mediaHTML}
    <div class="media-overlay"></div>
    <span class="pcard-cat cat-${p.kategoria}">${icon} ${katLabel}</span>
    <span class="pcard-status ${statusClass}">${statusLabel}</span>
  </div>
  <div class="pcard-body">
    <div class="pcard-sub">${p.podkategoria || ''}</div>
    <div class="pcard-title">${p.nazwa_projektu || p.tytul}</div>
    <div class="pcard-pitch">${p.omowienie || p.pitch}</div>
    <div class="pcard-tags">${tagsHTML}</div>
  </div>
  <div class="pcard-footer">
    <span>${p.status}</span>
    <span class="pcard-more">Szczegóły →</span>
  </div>
</div>`;
}

// Card HTML (list)
function listCardHTML(p) {
  const mediaHTML = buildListMediaHTML(p.media);
  const statusLabel = STATUS_LABELS[p.status] || p.status;
  const statusClass = `status-${p.status}`;
  
  return `
<div class="list-card" onclick="openModal('${p.id}')">
  <div class="list-media">${mediaHTML}</div>
  <div class="list-body">
    <div class="list-header">
      <span class="list-sub">${p.podkategoria || ''}</span>
      <span class="status-badge ${statusClass}" style="font-size:0.6rem;padding:0.15rem 0.5rem">${statusLabel}</span>
    </div>
    <div class="list-title">${p.nazwa_projektu || p.tytul}</div>
    <div class="list-pitch">${(p.omowienie || p.pitch || '').substring(0, 120)}...</div>
    <div class="list-meta">
      <span>📄 ${p.dokumentacja ? 'Dokumentacja' : 'Brak dokumentacji'}</span>
      <span>🖼️ ${hasMedia(p.media) ? 'Media' : 'Brak media'}</span>
    </div>
  </div>
  <div class="list-actions">
    <span class="pcard-more">Szczegóły →</span>
  </div>
</div>`;
}

// Build media HTML
function buildMediaHTML(media) {
  if (!media || (!media.zdjecie && !media.youtube)) {
    return `<div class="pcard-media-placeholder">${ICONS.default}</div>`;
  }
  if (media.zdjecie) {
    return `<img src="${media.zdjecie}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'pcard-media-placeholder\\'>🚀</div>'">`;
  }
  if (media.youtube) {
    return `
      <a href="https://www.youtube.com/watch?v=${media.youtube}" target="_blank" rel="noopener"
         style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-decoration:none;">
        <img src="https://img.youtube.com/vi/${media.youtube}/mqdefault.jpg"
             style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;"
             alt="YouTube" loading="lazy"
             onerror="this.style.display='none'">
        <div style="position:relative;z-index:1;width:52px;height:52px;border-radius:50%;
                    background:rgba(255,0,0,0.85);display:flex;align-items:center;
                    justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.5);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
      </a>`;
  }
  return `<div class="pcard-media-placeholder">🚀</div>`;
}

// Build list media HTML
function buildListMediaHTML(media) {
  if (!media || !media.zdjecie) {
    return `<div class="list-media-placeholder">🖼️</div>`;
  }
  return `<img src="${media.zdjecie}" alt="" onerror="this.parentElement.innerHTML='<div class=\\'list-media-placeholder\\'>🖼️</div>'">`;
}

// Check if has media
function hasMedia(media) {
  if (!media) return false;
  return media.zdjecie || media.youtube || media.facebook || media.instagram || media.linkedin;
}

        <div class="outline-title">🏷️ Tagi</div>
        <div class="outline-status">✓</div>
      </div>
      <div class="outline-content">
        ${p.tagi.map(t => `<span class="ptag">${t}</span>`).join(' ')}
      </div>
    </div>
    ` : ''}
  `;

  // Actions
  const actionsContainer = document.getElementById('modalActions');
  let actions = `<button class="btn-action btn-action-main" onclick="window.location.href='mailto:wolanin.w@gmail.com?subject=Dolaczam do projektu: ${encodeURIComponent(p.nazwa_projektu || p.tytul)}'">🤝 Dołącz do projektu →</button>`;
  
  if (p.dokumentacja) {
    actions += `<a class="btn-action btn-action-outline" href="${p.dokumentacja}" target="_blank" rel="noopener">📄 Dokumentacja</a>`;
  }
  
  actionsContainer.innerHTML = actions;

  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

// Toggle section
function toggleSection(header) {
  const item = header.closest('.outline-item');
  item.classList.toggle('expanded');
}

// Close modal
function closeModal(force) {
  if (force === true || event?.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('open');
    document.body.style.overflow = '';
  }
}

// Helper functions
function hasContent(obj) {
  if (!obj) return false;
  if (Array.isArray(obj)) return obj.length > 0;
  if (typeof obj === 'object') {
    return Object.values(obj).some(v => v && v !== '');
  }
  return Boolean(obj);
}

document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(true); });

loadProjects();
</script>
